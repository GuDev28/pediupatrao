# Configurando a conexão com MongoDB enquanto repositório de dados
# (pode ser sobrescrita pelas variáveis de ambiente MONGODB_URI e MONGODB_DATABASE)
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://alunos:semestudareureprovarei@cluster0.tibnnz0.mongodb.net/?appName=Cluster0}
# Banco próprio deste projeto, para não misturar usuários/pedidos com o banco compartilhado "pizzaria"
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao_gustavo}
# Cria os índices declarados nas entidades (ex.: auditoria por data e por entidade)
spring.data.mongodb.auto-index-creation=true

# Usuários iniciais (criados apenas se ainda não existirem; as senhas nunca são gravadas em log)
pediupatrao.dados-demonstracao=true
pediupatrao.senha-inicial.admin=${SENHA_ADMIN:teste123}
pediupatrao.senha-inicial.gerente=${SENHA_GERENTE:gerente123}
pediupatrao.senha-inicial.atendente=${SENHA_ATENDENTE:atendente123}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Sessão expira após 30 minutos sem uso; cookie de sessão inacessível via JavaScript
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Erros não expõem detalhes internos (stack trace / mensagens de exceção) ao usuário
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.com.umc.pediupatrao=INFO
