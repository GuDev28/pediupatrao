# Perfil "demo" (dashboard): usa um banco SEPARADO para não misturar pedidos fictícios
# com os dados reais. Na primeira execução, se a coleção "pedidos" estiver vazia, gera
# clientes, produtos e um histórico de pedidos de exemplo (DemonstracaoDashboardConfig).
#
# Executar:  mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#   Windows: mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=demo"
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao_demo}
pediupatrao.demo.dias-historico=${DEMO_DIAS_HISTORICO:120}
pediupatrao.demo.semente=2026
