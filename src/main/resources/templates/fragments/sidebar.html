<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <!--
            O menu mostra apenas o que o perfil pode usar, mas isso é só conveniência:
            as permissões são verificadas no backend (SecurityConfig e serviços).
        -->
        <div th:fragment="sidebar">
            <div id="sidebar" class="d-flex flex-column">
                <h4 class="text-center py-3 mb-0">Pediu Patrão</h4>

                <div class="px-3 pb-3 text-center small" th:if="${usuarioAtual != null}">
                    <i class="bi bi-person-circle"></i>
                    <span class="fw-semibold" th:text="${usuarioAtual}">usuario</span>
                    <span class="badge ms-1"
                          th:classappend="${ehAdmin} ? 'bg-danger' : (${ehGerente} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                          th:text="${perfilAtual != null} ? ${perfilAtual} : 'SEM PERFIL'">PERFIL</span>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${ehGerente or ehAtendente}">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${perfilAtual != null}">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${perfilAtual != null}">
                        <a class="nav-link" th:href="@{/produtos}">
                            <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Produtos</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${ehAdmin or ehGerente}">
                        <a class="nav-link" th:href="@{/auditoria}">
                            <i class="bi bi-journal-text"></i><span class="d-none d-md-inline">&nbsp;Auditoria</span>
                        </a>
                    </li>
                    <li class="nav-item" th:if="${ehAdmin}">
                        <a class="nav-link" th:href="@{/usuarios}">
                            <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                        </a>
                    </li>
                </ul>

                <!-- Logout via POST com token CSRF (incluído automaticamente pelo th:action) -->
                <form th:action="@{/logout}" method="post" class="mt-auto p-3">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right"></i><span class="d-none d-md-inline">&nbsp;Sair</span>
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
