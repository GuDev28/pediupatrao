<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <span class="text-muted small" th:unless="${ehGerente}">
            <i class="bi bi-lock"></i> Somente o GERENTE altera produtos e preços
        </span>
    </div>

    <!-- Cadastro/edição: somente GERENTE (rota e serviço também exigem GERENTE) -->
    <div class="card shadow-sm mb-4" style="max-width: 760px;" th:if="${ehGerente}">
        <div class="card-header fw-semibold"
             th:text="${produto.id != null} ? 'Editar produto' : 'Novo produto'">Produto</div>
        <div class="card-body">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="row g-2 align-items-end">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-4">
                    <label class="form-label small" for="nome">Nome</label>
                    <input type="text" class="form-control" th:field="*{nome}" required maxlength="100">
                </div>
                <div class="col-md-3">
                    <label class="form-label small" for="tipo">Tipo</label>
                    <select class="form-select" th:field="*{tipo}">
                        <option value="Pizza">Pizza</option>
                        <option value="Esfiha">Esfiha</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small" for="preco">Preço (R$)</label>
                    <input type="number" class="form-control" th:field="*{preco}" step="0.01" min="0.01" required>
                </div>
                <div class="col-md-1">
                    <div class="form-check mb-2">
                        <input type="checkbox" class="form-check-input" th:field="*{ativo}">
                        <label class="form-check-label small" th:for="${#ids.prev('ativo')}">Ativo</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <button type="submit" class="btn btn-success btn-sm w-100">Salvar</button>
                    <a th:if="${produto.id != null}" th:href="@{/produtos}" class="btn btn-outline-secondary btn-sm">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Listagem de Produtos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th class="text-end">Preço (R$)</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4" th:if="${ehGerente}">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="p : ${produtos}">
                        <td class="ps-4" th:text="${p.nome}"></td>
                        <td th:text="${p.tipo}"></td>
                        <td class="text-end" th:text="${p.preco != null} ? ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td th:text="${p.ativo != null and p.ativo} ? 'Sim' : 'Não'">Sim</td>
                        <td class="text-end pe-4 text-nowrap" th:if="${ehGerente}">
                            <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </a>
                            <form th:action="@{/produtos/excluir/{id}(id=${p.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Tem certeza que deseja excluir este produto?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
