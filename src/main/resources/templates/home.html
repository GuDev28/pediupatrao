<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
</head>
<body>

<div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 80vh;" th:fragment="content">
    <div class="text-center">
        <img th:src="@{/images/logo.png}" alt="Logo" width="260" height="260">
        <h1 class="mt-3">Bem-vindo, <span th:text="${usuarioAtual}">usuário</span>!</h1>
        <p class="text-muted" th:if="${perfilAtual != null}">
            Perfil: <strong th:text="${perfilAtual.descricao}">Perfil</strong>
        </p>
        <p class="text-danger" th:if="${perfilAtual == null}">
            Seu usuário não possui perfil de acesso. Procure um administrador.
        </p>

        <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
            <a th:if="${ehGerente or ehAtendente}" th:href="@{/pedidos/novo}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Registrar pedido
            </a>
            <a th:if="${perfilAtual != null}" th:href="@{/pedidos}" class="btn btn-outline-primary">
                <i class="bi bi-bag me-1"></i>Pedidos
            </a>
            <a th:if="${ehAtendente}" th:href="@{/clientes/novo}" class="btn btn-outline-secondary">
                <i class="bi bi-person-plus me-1"></i>Novo cliente
            </a>
            <a th:if="${ehAdmin or ehGerente}" th:href="@{/auditoria}" class="btn btn-outline-dark">
                <i class="bi bi-journal-text me-1"></i>Auditoria
            </a>
            <a th:if="${ehAdmin}" th:href="@{/usuarios}" class="btn btn-outline-danger">
                <i class="bi bi-people-fill me-1"></i>Usuários e perfis
            </a>
        </div>
    </div>
</div>

</body>
</html>
